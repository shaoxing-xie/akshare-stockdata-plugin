    - data:
        code: "import json\nimport re\nfrom datetime import datetime, timedelta\n\n\
          def main(llm_output: str) -> dict:\n    \"\"\"\n    解析股票代码提取节点的JSON输出，提取股票代码和A股市场信息\n\
          \    同时计算动态的开始和结束日期\n    \"\"\"\n    # 计算日期\n    today = datetime.now()\n\
          \    end_date = today - timedelta(days=1)  # 昨天\n    start_date = end_date\
          \ - timedelta(days=365)  # 前推1年\n    \n    # 格式化日期为YYYYMMDD\n    end_date_str\
          \ = end_date.strftime('%Y%m%d')\n    start_date_str = start_date.strftime('%Y%m%d')\n\
          \    \n    try:\n        # 尝试解析JSON\n        data = json.loads(llm_output)\n\
          \        \n        stock_code = data.get('stock_code', '')\n        market\
          \ = data.get('market', '')\n        is_a_stock = data.get('is_a_stock',\
          \ False)\n        \n        return {\n            'stock_code': stock_code,\n\
          \            'market': market,\n            'is_a_stock': str(is_a_stock).lower(),\
          \  # 转换为字符串\n            'start_date': start_date_str,\n            'end_date':\
          \ end_date_str\n        }\n    except json.JSONDecodeError:\n        # 如果不是JSON格式，尝试从文本中提取\n\
          \        # 查找6位数字代码\n        code_match = re.search(r'\\b(\\d{6})\\b', llm_output)\n\
          \        if code_match:\n            code = code_match.group(1)\n      \
          \      # 判断A股市场\n            if code.startswith(('600', '601', '603', '605',\
          \ '688', '689')):\n                market = '沪市A股'\n                is_a_stock\
          \ = 'true'\n            elif code.startswith(('000', '001', '002', '003',\
          \ '300', '301')):\n                market = '深市A股'\n                is_a_stock\
          \ = 'true'\n            elif code.startswith(('430', '830', '870')):\n \
          \               market = '北交所（京A）'\n                is_a_stock = 'true'\n\
          \            else:\n                market = '其他'\n                is_a_stock\
          \ = 'false'\n            \n            return {\n                'stock_code':\
          \ code,\n                'market': market,\n                'is_a_stock':\
          \ is_a_stock,\n                'start_date': start_date_str,\n         \
          \       'end_date': end_date_str\n            }\n        else:\n       \
          \     return {\n                'stock_code': '',\n                'market':\
          \ '',\n                'is_a_stock': 'false',\n                'start_date':\
          \ start_date_str,\n                'end_date': end_date_str\n          \
          \  }\n\n"
        code_language: python3
        desc: 解析股票代码提取节点的JSON输出，提取股票代码和A股市场信息
