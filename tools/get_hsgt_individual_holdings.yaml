identity:
  author: shaoxing-xie
  name: get_hsgt_individual_holdings
  label:
    zh_Hans: 获取沪深港通个股持股数据
    en_US: Get HSGT Individual Stock Holdings Data
description:
  human:
    zh_Hans: 获取指定股票的沪深港通持股数据，包括A股和港股的持股情况。帮助了解特定股票在沪深港通中的持股情况。
    en_US: Get HSGT (Hong Kong-Shanghai-Shenzhen Stock Connect) holdings data for specified stocks, including A-share and HK stock holdings. Helps understand specific stock holdings in HSGT.
  llm: 获取指定股票的沪深港通持股数据，包括A股和港股的持股情况。包括：东方财富网-沪深港通持股-具体股票（需要股票代码，返回指定股票在沪深港通中的持股数据）。需要提供股票代码参数，格式如"600519"（沪市）、"000001"（深市）、"00700"（港股）等。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: stock_hsgt_individual_em
    description: 接口名称
    llm_description: 选择沪深港通个股持股数据接口。包括：东方财富网-沪深港通持股-具体股票（需要股票代码，返回指定股票在沪深港通中的持股数据，包括持股比例、持股数量、持股市值等信息）。需要提供股票代码参数。
    human_description:
      en_US: "Select HSGT individual stock holdings data interface. Options: East Money - HSGT Holdings Specific Stock (requires stock code, returns HSGT holdings data for specified stock, including holding ratio, holding quantity, holding market value, etc.). Requires stock code parameter."
      zh_Hans: "选择沪深港通个股持股数据接口。选项包括：东方财富网-沪深港通持股-具体股票（需要股票代码，返回指定股票在沪深港通中的持股数据，包括持股比例、持股数量、持股市值等信息）。需要提供股票代码参数。"
    label:
      en_US: Interface
      zh_Hans: 接口名称
    options:
      - label:
          en_US: East Money - HSGT Holdings Specific Stock - Specify A-share and HK Stock
          zh_Hans: 东方财富网-沪深港通持股-具体股票-指定A股和港股
        value: stock_hsgt_individual_em
  - name: symbol
    type: string
    required: true
    form: llm
    default: "600519"
    description: 股票代码
    llm_description: 股票代码，支持A股和港股格式，如600519（沪市）、000001（深市）、00700（港股）等。
    human_description:
      en_US: "Stock code. Supports A-share and HK stock formats, e.g., 600519 (Shanghai), 000001 (Shenzhen), 00700 (HK stock), etc."
      zh_Hans: "股票代码。支持A股和港股格式，如600519（沪市）、000001（深市）、00700（港股）等。"
    label:
      en_US: Stock Code
      zh_Hans: 股票代码
  - name: retries
    type: number
    required: false
    form: llm
    default: 5
    description: 重试次数
    llm_description: 网络请求重试次数，范围1-10，默认5次。
    human_description:
      en_US: "Number of retries for network requests. Range: 1-10. Default: 5."
      zh_Hans: "网络请求重试次数。范围：1-10。默认：5。"
    label:
      en_US: Retries
      zh_Hans: 重试次数
    min: 1
    max: 10
  - name: timeout
    type: number
    required: false
    form: llm
    default: 600
    description: 子进程超时时间
    llm_description: 子进程执行超时时间（秒），范围5-3600，默认600秒（10分钟）。
    human_description:
      en_US: "Subprocess execution timeout in seconds. Range: 5-3600. Default: 600 (10 minutes)."
      zh_Hans: "子进程执行超时时间（秒）。范围：5-3600。默认：600（10分钟）。"
    label:
      en_US: Subprocess Timeout
      zh_Hans: 子进程超时时间
    min: 5
    max: 3600
extra:
  python:
    source: tools/get_hsgt_individual_holdings.py

