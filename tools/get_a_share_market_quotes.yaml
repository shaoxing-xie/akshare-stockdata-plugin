identity:
  author: shaoxing-xie
  name: get_a_share_market_quotes
  label:
    zh_Hans: 获取A股市场实时行情
    en_US: Get A-Share Market Quotes
description:
  human:
    zh_Hans: 获取A股各市场的实时行情数据，包括沪深京A股、沪市、深市、京市、新股等全量市场数据。数据量较大，返回所有股票的实时价格、涨跌幅、成交量等信息。
    en_US: Get real-time market data for A-share markets, including Shanghai, Shenzhen, Beijing A-shares, and new stocks. Large data volumes, returns real-time prices, changes, trading volumes for all stocks.
  llm: 获取A股各市场的实时行情数据，包括沪深京A股、沪市、深市、京市、新股等全量市场数据。包括：沪深京A股实时行情（东方财富网/新浪财经两个数据源）、沪A股实时行情、深A股实时行情、京A股实时行情、新股实时行情。所有接口无需参数，返回对应市场的所有股票的实时行情数据，包括股票代码、名称、最新价、涨跌幅、涨跌额、成交量、成交额、换手率等。注意：数据量较大，建议设置较长的超时时间。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: stock_zh_a_spot
    description: 接口名称
    llm_description: 选择A股市场实时行情接口。包括：沪深京A股实时行情（东方财富网/新浪财经两个数据源）、沪A股实时行情、深A股实时行情、京A股实时行情、新股实时行情。所有接口无需参数，返回对应市场的所有股票实时行情数据。
    human_description:
      en_US: "Select A-share market real-time quotes interface. Options: Shanghai-Shenzhen-Beijing A-share (Eastmoney/Sina Finance), Shanghai A-share, Shenzhen A-share, Beijing A-share, New Stock. All interfaces require no parameters, return all stock real-time quotes for the corresponding market."
      zh_Hans: "选择A股市场实时行情接口。选项包括：沪深京A股实时行情（东方财富网/新浪财经两个数据源）、沪A股实时行情、深A股实时行情、京A股实时行情、新股实时行情。所有接口无需参数，返回对应市场的所有股票实时行情数据。"
    label:
      en_US: Interface
      zh_Hans: 接口名称
    options:
      - label:
          en_US: Sina Finance - Shanghai-Shenzhen-Beijing A-share - Real-time Quotes
          zh_Hans: 新浪财经-沪深京A股-实时行情数据
        value: stock_zh_a_spot
      - label:
          en_US: Eastmoney - Shanghai A-share - Real-time Quotes
          zh_Hans: 东方财富网-沪A股-实时行情数据
        value: stock_sh_a_spot_em
      - label:
          en_US: Eastmoney - Shenzhen A-share - Real-time Quotes
          zh_Hans: 东方财富网-深A股-实时行情数据
        value: stock_sz_a_spot_em
      - label:
          en_US: Eastmoney - Beijing A-share - Real-time Quotes
          zh_Hans: 东方财富网-京A股-实时行情数据
        value: stock_bj_a_spot_em
      - label:
          en_US: Eastmoney - New Shares - Real-time Quotes
          zh_Hans: 东方财富网-新股-实时行情数据
        value: stock_new_a_spot_em
      - label:
          en_US: Eastmoney - Shanghai-Shenzhen-Beijing A-share - Real-time Quotes
          zh_Hans: 东方财富网-沪深京A股-实时行情数据
        value: stock_zh_a_spot_em
  - name: retries
    type: number
    required: false
    form: llm
    default: 5
    description: 重试次数
    llm_description: 网络请求重试次数，范围1-10，默认5次。
    human_description:
      en_US: "Number of retries for network requests. Range: 1-10. Default: 5."
      zh_Hans: "网络请求重试次数。范围：1-10。默认：5。"
    label:
      en_US: Retries
      zh_Hans: 重试次数
    min: 1
    max: 10
  - name: timeout
    type: number
    required: false
    form: llm
    default: 900
    description: 子进程超时时间
    llm_description: 子进程执行超时时间（秒），范围5-3600，默认900秒（15分钟）。实时行情接口数据量大，建议设置较长的超时时间。
    human_description:
      en_US: "Subprocess execution timeout in seconds. Range: 5-3600. Default: 900 (15 minutes). Real-time market data interfaces have large data volumes, recommend setting longer timeout."
      zh_Hans: "子进程执行超时时间（秒）。范围：5-3600。默认：900（15分钟）。实时行情接口数据量大，建议设置较长的超时时间。"
    label:
      en_US: Subprocess Timeout
      zh_Hans: 子进程超时时间
    min: 5
    max: 3600
extra:
  python:
    source: tools/get_a_share_market_quotes.py

