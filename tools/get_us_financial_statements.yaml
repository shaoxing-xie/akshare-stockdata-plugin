identity:
  author: shaoxing-xie
  name: get_us_financial_statements
  label:
    zh_Hans: 获取美股财务分析三大报表
    en_US: Get US Stock Financial Analysis Three Major Statements
description:
  human:
    zh_Hans: 获取美股财务分析三大报表数据，包括资产负债表、利润表和现金流量表，支持指定股票代码、报表类型和指标类型。
    en_US: Get US stock financial analysis three major statements data, including balance sheet, profit statement and cash flow statement, supporting specifying stock code, report type and indicator type.
  llm: 获取美股财务分析三大报表数据。包括：东方财富网-美股-财务分析-三大报表-指定股票代码、报表类型、指标类型。需要提供美股代码、报表类型和指标类型。财务分析接口使用原始股票代码格式（不需要105.前缀）。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: stock_financial_us_report_em
    description: 接口名称
    llm_description: 选择美股财务分析三大报表接口
    human_description:
      en_US: "Select the US stock financial analysis three major statements interface."
      zh_Hans: "选择美股财务分析三大报表接口。"
    label:
      en_US: Interface
      zh_Hans: 接口名称
    options:
      - label:
          en_US: East Money - US - Financial Analysis - Three Major Reports - Specify Stock Code, Report Type, Indicator Type
          zh_Hans: 东方财富网-美股-财务分析-三大报表-指定股票代码、报表类型、指标类型
        value: stock_financial_us_report_em
  - name: stock_code
    type: string
    required: false
    form: llm
    default: "AAPL"
    description: 美股代码
    llm_description: 美股个股代码，格式：AAPL、MSFT、GOOGL等。财务分析接口使用原始格式（不需要105.前缀）
    human_description:
      en_US: "US stock code. Format: AAPL, MSFT, GOOGL, etc. Financial analysis interfaces use original format (no 105. prefix required)."
      zh_Hans: "美股代码。格式：AAPL、MSFT、GOOGL等。财务分析接口使用原始格式（不需要105.前缀）。"
    label:
      en_US: US Stock Code
      zh_Hans: 美股代码
  - name: indicator_us
    type: select
    required: false
    form: llm
    default: 年报
    description: 美股指标类型
    llm_description: 美股财务指标接口的指标类型参数
    human_description:
      en_US: "US indicator type. Required for: US - Financial Analysis - Three Major Reports. Options: 年报 (Annual Report), 单季报 (Single Quarter), 累计季报 (Cumulative Quarter)."
      zh_Hans: "美股指标类型。需要此参数的接口：美股-财务分析-三大报表。选项：年报、单季报、累计季报。"
    label:
      en_US: US Indicator Type
      zh_Hans: 美股指标类型
    options:
      - label:
          en_US: Annual Report
          zh_Hans: 年报
        value: "年报"
      - label:
          en_US: Single Quarter
          zh_Hans: 单季报
        value: "单季报"
      - label:
          en_US: Cumulative Quarter
          zh_Hans: 累计季报
        value: "累计季报"
  - name: report_type
    type: select
    required: false
    form: llm
    default: 资产负债表
    description: 报表类型
    llm_description: 美股三大报表接口的报表类型参数
    human_description:
      en_US: "Report type. Required for: US - Financial Analysis - Three Major Reports. Options: 资产负债表 (Balance Sheet), 利润表 (Profit Statement), 现金流量表 (Cash Flow Statement)."
      zh_Hans: "报表类型。需要此参数的接口：美股-财务分析-三大报表。选项：资产负债表、利润表、现金流量表。"
    label:
      en_US: Report Type
      zh_Hans: 报表类型
    options:
      - label:
          en_US: Balance Sheet
          zh_Hans: 资产负债表
        value: "资产负债表"
      - label:
          en_US: Profit Statement
          zh_Hans: 利润表
        value: "利润表"
      - label:
          en_US: Cash Flow Statement
          zh_Hans: 现金流量表
        value: "现金流量表"
  - name: retries
    type: number
    required: false
    form: llm
    default: 5
    description: 重试次数
    llm_description: 网络请求重试次数，默认5次
    human_description:
      en_US: "Number of retries for network requests. Range: 1-10. Default: 5."
      zh_Hans: "网络请求重试次数。范围：1-10。默认：5。"
    label:
      en_US: Retries
      zh_Hans: 重试次数
    min: 1
    max: 10
  - name: timeout
    type: number
    required: false
    form: llm
    default: 600
    description: 子进程超时时间
    llm_description: 子进程执行超时时间（秒），默认600秒
    human_description:
      en_US: "Subprocess execution timeout in seconds. Range: 5-3600. Default: 600."
      zh_Hans: "子进程执行超时时间（秒）。范围：5-3600。默认：600。"
    label:
      en_US: Subprocess Timeout
      zh_Hans: 子进程超时时间
    min: 5
    max: 3600
extra:
  python:
    source: tools/get_us_financial_statements.py

