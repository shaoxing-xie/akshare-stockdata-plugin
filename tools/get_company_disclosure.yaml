      - label:
          en_US: Corporate Governance
          zh_Hans: 公司治理
        value: "公司治理"
      - label:
          en_US: Intermediary Report
          zh_Hans: 中介报告
        value: "中介报告"
      - label:
          en_US: IPO
          zh_Hans: 首发
        value: "首发"
      - label:
          en_US: Secondary Offering
          zh_Hans: 增发
