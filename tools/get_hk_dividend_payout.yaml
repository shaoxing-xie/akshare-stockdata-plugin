identity:
  author: shaoxing-xie
  name: get_hk_dividend_payout
  label:
    zh_Hans: 获取港股个股分红派息数据
    en_US: Get Hong Kong Stock Individual Dividend Payout Data
description:
  human:
    zh_Hans: 获取港股个股分红派息数据，包括同花顺和东方财富网的分红派息信息。帮助了解港股个股的分红派息情况。
    en_US: Get Hong Kong stock individual dividend payout data, including dividend distribution information from THS and Eastmoney. Helps understand dividend payout situations of Hong Kong stocks.
  llm: 获取港股个股分红派息数据。包括：同花顺-港股-个股-分红派息-指定股票代码、东方财富网-港股-个股-分红派息-指定股票代码。所有接口都需要提供港股代码。注意：同花顺接口需要4位数字代码（如0700），东方财富网接口需要5位数字代码（如00700）。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: stock_hk_dividend_payout_em
    description: 接口名称
    llm_description: 选择港股个股分红派息接口。包括：同花顺-港股-个股-分红派息-指定股票代码、东方财富网-港股-个股-分红派息-指定股票代码。所有接口都需要提供港股代码。注意：同花顺接口需要4位数字代码（如0700），东方财富网接口需要5位数字代码（如00700）。
    human_description:
      en_US: "Select Hong Kong stock individual dividend payout interface. Options: THS - HK Stock - Individual Stock - Dividend Distribution - Specify Stock Code, Eastmoney - HK Stock - Individual Stock - Dividend Payout - Specify Stock Code. All interfaces require Hong Kong stock code. Note: THS interface requires 4-digit code (e.g., 0700), Eastmoney interface requires 5-digit code (e.g., 00700)."
      zh_Hans: "选择港股个股分红派息接口。选项包括：同花顺-港股-个股-分红派息-指定股票代码、东方财富网-港股-个股-分红派息-指定股票代码。所有接口都需要提供港股代码。注意：同花顺接口需要4位数字代码（如0700），东方财富网接口需要5位数字代码（如00700）。"
    label:
      en_US: Interface
      zh_Hans: 接口名称
    options:
      - label:
          en_US: THS - HK Stock - Individual Stock - Dividend Distribution - Specify Stock Code
          zh_Hans: 同花顺-港股-个股-分红派息-指定股票代码
        value: stock_hk_fhpx_detail_ths
      - label:
          en_US: East Money - HK Stock - Individual Stock - Dividend Payout - Specify Stock Code
          zh_Hans: 东方财富网-港股-个股-分红派息-指定股票代码
        value: stock_hk_dividend_payout_em
  - name: stock_code
    type: string
    required: false
    form: llm
    default: "00700"
    description: 港股代码
    llm_description: 港股代码，格式：00700、03900、HK00700；港股：5位数字代码(00700)或市场前缀(HK00700)。注意：同花顺接口会自动转换为4位格式（0700），东方财富网接口保持5位格式（00700）。
    human_description:
      en_US: "Hong Kong stock code. Format: 00700, 03900, HK00700. Note: THS interface will automatically convert to 4-digit format (0700), Eastmoney interface keeps 5-digit format (00700)."
      zh_Hans: "港股代码。格式：00700、03900、HK00700；港股：5位数字代码(00700)或市场前缀(HK00700)。注意：同花顺接口会自动转换为4位格式（0700），东方财富网接口保持5位格式（00700）。"
    label:
      en_US: HK Stock Code
      zh_Hans: 港股代码
  - name: retries
    type: number
    required: false
    form: llm
    default: 5
    description: 重试次数
    llm_description: 网络请求重试次数，默认5次
    human_description:
      en_US: "Number of retries for network requests. Range: 1-10. Default: 5."
      zh_Hans: "网络请求重试次数。范围：1-10。默认：5。"
    label:
      en_US: Retries
      zh_Hans: 重试次数
    min: 1
    max: 10
  - name: timeout
    type: number
    required: false
    form: llm
    default: 600
    description: 子进程超时时间
    llm_description: 子进程执行超时时间（秒），默认600秒
    human_description:
      en_US: "Subprocess execution timeout in seconds. Range: 5-3600. Default: 600."
      zh_Hans: "子进程执行超时时间（秒）。范围：5-3600。默认：600。"
    label:
      en_US: Subprocess Timeout
      zh_Hans: 子进程超时时间
    min: 5
    max: 3600
extra:
  python:
    source: tools/get_hk_dividend_payout.py

