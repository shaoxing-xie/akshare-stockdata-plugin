identity:
  author: shaoxing-xie
  name: get_board_em
  label:
    zh_Hans: 获取东方财富板块数据
    en_US: Get East Money Board Data
description:
  human:
    zh_Hans: 获取东方财富板块数据。包括概念板块和行业板块的列表、实时行情、板块成份、历史行情和分时数据等。帮助了解东方财富板块的行情走势和基本信息。适用于板块分析、主题投资和行业研究。
    en_US: Get East Money board data. Includes concept board and industry board lists, real-time quotes, constituent stocks, historical quotes, and minute data. Helps understand East Money board quote trends and basic information. Suitable for board analysis, thematic investment, and industry research.
  llm: 获取东方财富板块数据。包括：东方财富-概念板块（无需参数，返回所有概念板块的实时行情数据）、东方财富-概念板块-实时行情-指定概念板块（需要概念名称，返回指定概念板块的实时行情）、东方财富-概念板块-板块成份-指定概念板块或板块代码（需要概念名称或板块代码，返回指定概念板块的成份股数据）、东方财富-概念板块-历史行情数据-指定概念板块、周期、日期范围和复权方式（需要概念名称、周期、日期范围和复权方式，返回指定概念板块的历史行情数据）、东方财富-概念板块-分时历史行情数据-指定概念板块和分时周期（需要概念名称和分时周期，返回指定概念板块的分时数据）、东方财富-行业板块（无需参数，返回所有行业板块的实时行情数据）、东方财富-行业板块-实时行情-指定行业名称（需要行业名称，返回指定行业板块的实时行情）、东方财富-行业板块-板块成份-指定行业名称或板块代码（需要行业名称或板块代码，返回指定行业板块的成份股数据）、东方财富-行业板块-历史行情数据-指定行业名称、周期、日期范围和复权方式（需要行业名称、周期、日期范围和复权方式，返回指定行业板块的历史行情数据）、东方财富-行业板块-分时历史行情数据-指定行业名称和分时周期（需要行业名称和分时周期，返回指定行业板块的分时数据）。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: stock_board_concept_name_em
    description: 接口名称
    llm_description: 选择东方财富板块数据接口。包括：东方财富-概念板块（无需参数）、东方财富-概念板块-实时行情-指定概念板块（需要概念名称）、东方财富-概念板块-板块成份-指定概念板块或板块代码（需要概念名称或板块代码）、东方财富-概念板块-历史行情数据-指定概念板块、周期、日期范围和复权方式（需要概念名称、周期、日期范围和复权方式）、东方财富-概念板块-分时历史行情数据-指定概念板块和分时周期（需要概念名称和分时周期）、东方财富-行业板块（无需参数）、东方财富-行业板块-实时行情-指定行业名称（需要行业名称）、东方财富-行业板块-板块成份-指定行业名称或板块代码（需要行业名称或板块代码）、东方财富-行业板块-历史行情数据-指定行业名称、周期、日期范围和复权方式（需要行业名称、周期、日期范围和复权方式）、东方财富-行业板块-分时历史行情数据-指定行业名称和分时周期（需要行业名称和分时周期）。
    human_description:
      en_US: "Select East Money board data interface. Options: East Money - Concept Board List (no parameters required), East Money - Concept Board Real-time Quotes (requires concept name), East Money - Constituent Stocks (requires concept name or board code), East Money - Index Historical Quotes (requires concept name, period, date range, and adjustment method), East Money - Index Minute Data (requires concept name and minute period), East Money - Industry Board List (no parameters required), East Money - Industry Board Real-time Quotes (requires industry name), East Money - Constituent Stocks (requires industry name or board code), East Money - Index Daily Data (requires industry name, period, date range, and adjustment method), East Money - Index Minute Data (requires industry name and minute period)."
      zh_Hans: "选择东方财富板块数据接口。选项包括：东方财富-概念板块（无需参数）、东方财富-概念板块-实时行情-指定概念板块（需要概念名称）、东方财富-概念板块-板块成份-指定概念板块或板块代码（需要概念名称或板块代码）、东方财富-概念板块-历史行情数据-指定概念板块、周期、日期范围和复权方式（需要概念名称、周期、日期范围和复权方式）、东方财富-概念板块-分时历史行情数据-指定概念板块和分时周期（需要概念名称和分时周期）、东方财富-行业板块（无需参数）、东方财富-行业板块-实时行情-指定行业名称（需要行业名称）、东方财富-行业板块-板块成份-指定行业名称或板块代码（需要行业名称或板块代码）、东方财富-行业板块-历史行情数据-指定行业名称、周期、日期范围和复权方式（需要行业名称、周期、日期范围和复权方式）、东方财富-行业板块-分时历史行情数据-指定行业名称和分时周期（需要行业名称和分时周期）。"
    label:
      en_US: Interface
      zh_Hans: 接口名称
    options:
      - label:
          en_US: East Money - Concept Board List - All
          zh_Hans: 东方财富-概念板块
        value: stock_board_concept_name_em
      - label:
          en_US: East Money - Concept Board Real-time Quotes - Concept Name
          zh_Hans: 东方财富-概念板块-实时行情-指定概念板块
        value: stock_board_concept_spot_em
      - label:
          en_US: East Money - Constituent Stocks - Concept Name or Board Code
          zh_Hans: 东方财富-概念板块-板块成份-指定概念板块或板块代码
        value: stock_board_concept_cons_em
      - label:
          en_US: East Money - Index Historical Quotes - Concept Name, Period, Date Range, Adjustment
          zh_Hans: 东方财富-概念板块-历史行情数据-指定概念板块、周期、日期范围和复权方式
        value: stock_board_concept_hist_em
      - label:
          en_US: East Money - Index Minute Data - Concept Name and Minute Period
          zh_Hans: 东方财富-概念板块-分时历史行情数据-指定概念板块和分时周期
        value: stock_board_concept_hist_min_em
      - label:
          en_US: East Money - Industry Board List - All
          zh_Hans: 东方财富-行业板块
        value: stock_board_industry_name_em
      - label:
          en_US: East Money - Industry Board Real-time Quotes - Industry Name
          zh_Hans: 东方财富-行业板块-实时行情-指定行业名称
        value: stock_board_industry_spot_em
      - label:
          en_US: East Money - Constituent Stocks - Industry Name or Board Code
          zh_Hans: 东方财富-行业板块-板块成份-指定行业名称或板块代码
        value: stock_board_industry_cons_em
      - label:
          en_US: East Money - Index Daily Data - Industry Name, Period, Date Range, Adjustment
          zh_Hans: 东方财富-行业板块-历史行情数据-指定行业名称、周期、日期范围和复权方式
        value: stock_board_industry_hist_em
      - label:
          en_US: East Money - Index Minute Data - Industry Name and Minute Period
          zh_Hans: 东方财富-行业板块-分时历史行情数据-指定行业名称和分时周期
        value: stock_board_industry_hist_min_em
  - name: symbol
    type: string
    required: false
    form: llm
    default: "融资融券"
    description: 板块名称
    llm_description: 板块名称，指定要查询的概念板块或行业板块名称。概念板块接口需要东方财富概念名称（如"融资融券"、"绿色电力"）或板块代码（如"BK0655"），行业板块接口需要东方财富行业名称（如"小金属"、"煤炭行业"）或板块代码（如"BK1027"）。"东方财富-概念板块-实时行情"、"东方财富-概念板块-板块成份"、"东方财富-概念板块-历史行情数据"、"东方财富-概念板块-分时历史行情数据"、"东方财富-行业板块-实时行情"、"东方财富-行业板块-板块成份"、"东方财富-行业板块-历史行情数据"、"东方财富-行业板块-分时历史行情数据"接口需要此参数。
    human_description:
      en_US: "Board name. Required for most interfaces. For concept board interfaces, use East Money concept names (e.g., '融资融券', '绿色电力') or board codes (e.g., 'BK0655'). For industry board interfaces, use East Money industry names (e.g., '小金属', '煤炭行业') or board codes (e.g., 'BK1027'). Required for: East Money - Concept Board Real-time Quotes, East Money - Constituent Stocks, East Money - Index Historical Quotes, East Money - Index Minute Data, East Money - Industry Board Real-time Quotes, East Money - Constituent Stocks, East Money - Index Daily Data, East Money - Index Minute Data."
      zh_Hans: "板块名称。大部分接口需要此参数。概念板块接口使用东方财富概念名称（如'融资融券'、'绿色电力'）或板块代码（如'BK0655'），行业板块接口使用东方财富行业名称（如'小金属'、'煤炭行业'）或板块代码（如'BK1027'）。东方财富-概念板块-实时行情、东方财富-概念板块-板块成份、东方财富-概念板块-历史行情数据、东方财富-概念板块-分时历史行情数据、东方财富-行业板块-实时行情、东方财富-行业板块-板块成份、东方财富-行业板块-历史行情数据、东方财富-行业板块-分时历史行情数据接口需要此参数。"
    label:
      en_US: Board Name
      zh_Hans: 板块名称
  - name: start_date
    type: string
    required: false
    form: llm
    default: "20200101"
    description: 开始日期
    llm_description: 开始日期，格式为YYYYMMDD（如20200101）。"东方财富-概念板块-历史行情数据"和"东方财富-行业板块-历史行情数据"接口需要此参数。
    human_description:
      en_US: "Start date in YYYYMMDD format (e.g., 20200101). Required for 'East Money - Concept Board Historical Quotes' and 'East Money - Industry Board Historical Quotes' interfaces."
      zh_Hans: "开始日期，格式为YYYYMMDD（如20200101）。东方财富-概念板块-历史行情数据和东方财富-行业板块-历史行情数据接口需要此参数。"
    label:
      en_US: Start Date
      zh_Hans: 开始日期
  - name: end_date
    type: string
    required: false
    form: llm
    default: "20250321"
    description: 结束日期
    llm_description: 结束日期，格式为YYYYMMDD（如20250321）。"东方财富-概念板块-历史行情数据"和"东方财富-行业板块-历史行情数据"接口需要此参数。
    human_description:
      en_US: "End date in YYYYMMDD format (e.g., 20250321). Required for 'East Money - Concept Board Historical Quotes' and 'East Money - Industry Board Historical Quotes' interfaces."
      zh_Hans: "结束日期，格式为YYYYMMDD（如20250321）。东方财富-概念板块-历史行情数据和东方财富-行业板块-历史行情数据接口需要此参数。"
    label:
      en_US: End Date
      zh_Hans: 结束日期
  - name: period
    type: select
    required: false
    form: llm
    default: "daily"
    description: 周期
    llm_description: 周期，选择数据周期。"东方财富-概念板块-历史行情数据"接口需要此参数，选项包括：daily（日线）、weekly（周线）、monthly（月线）。"东方财富-行业板块-历史行情数据"接口需要此参数，选项包括：日k（日线）、周k（周线）、月k（月线）。
    human_description:
      en_US: "Period. Required for historical quotes interfaces. For concept board interfaces, options: daily (Daily), weekly (Weekly), monthly (Monthly). For industry board interfaces, options: 日k (Daily), 周k (Weekly), 月k (Monthly)."
      zh_Hans: "周期。历史行情数据接口需要此参数。概念板块接口选项包括：daily（日线）、weekly（周线）、monthly（月线）。行业板块接口选项包括：日k（日线）、周k（周线）、月k（月线）。"
    label:
      en_US: Period
      zh_Hans: 周期
    options:
      - label:
          en_US: Daily (for concept board)
          zh_Hans: daily（日线，用于概念板块）
        value: "daily"
      - label:
          en_US: Weekly (for concept board)
          zh_Hans: weekly（周线，用于概念板块）
        value: "weekly"
      - label:
          en_US: Monthly (for concept board)
          zh_Hans: monthly（月线，用于概念板块）
        value: "monthly"
      - label:
          en_US: Daily (for industry board)
          zh_Hans: 日k（日线，用于行业板块）
        value: "日k"
      - label:
          en_US: Weekly (for industry board)
          zh_Hans: 周k（周线，用于行业板块）
        value: "周k"
      - label:
          en_US: Monthly (for industry board)
          zh_Hans: 月k（月线，用于行业板块）
        value: "月k"
  - name: adjust
    type: select
    required: false
    form: llm
    default: "none"
    description: 复权方式
    llm_description: 复权方式，选择复权类型。"东方财富-概念板块-历史行情数据"和"东方财富-行业板块-历史行情数据"接口需要此参数。选项包括：空字符串（不复权）、qfq（前复权）、hfq（后复权）。
    human_description:
      en_US: "Adjustment method. Required for historical quotes interfaces. Options: Empty string (No Adjustment), qfq (Forward Adjustment), hfq (Backward Adjustment)."
      zh_Hans: "复权方式。历史行情数据接口需要此参数。选项包括：空字符串（不复权）、qfq（前复权）、hfq（后复权）。"
    label:
      en_US: Adjustment Method
      zh_Hans: 复权方式
    options:
      - label:
          en_US: No Adjustment
          zh_Hans: 不复权
        value: "none"
      - label:
          en_US: Forward Adjustment
          zh_Hans: 前复权
        value: "qfq"
      - label:
          en_US: Backward Adjustment
          zh_Hans: 后复权
        value: "hfq"
  - name: minute_period
    type: select
    required: false
    form: llm
    default: "1"
    description: 分时周期
    llm_description: 分时周期，选择分时数据周期。"东方财富-概念板块-分时历史行情数据"和"东方财富-行业板块-分时历史行情数据"接口需要此参数。选项包括：1（1分钟）、5（5分钟）、15（15分钟）、30（30分钟）、60（60分钟）。
    human_description:
      en_US: "Minute period. Required for minute data interfaces. Options: 1 (1 minute), 5 (5 minutes), 15 (15 minutes), 30 (30 minutes), 60 (60 minutes)."
      zh_Hans: "分时周期。分时历史行情数据接口需要此参数。选项包括：1（1分钟）、5（5分钟）、15（15分钟）、30（30分钟）、60（60分钟）。"
    label:
      en_US: Minute Period
      zh_Hans: 分时周期
    options:
      - label:
          en_US: 1 Minute
          zh_Hans: 1分钟
        value: "1"
      - label:
          en_US: 5 Minutes
          zh_Hans: 5分钟
        value: "5"
      - label:
          en_US: 15 Minutes
          zh_Hans: 15分钟
        value: "15"
      - label:
          en_US: 30 Minutes
          zh_Hans: 30分钟
        value: "30"
      - label:
          en_US: 60 Minutes
          zh_Hans: 60分钟
        value: "60"
  - name: retries
    type: number
    required: false
    form: llm
    default: 5
    description: 重试次数
    llm_description: 网络请求重试次数，范围1-10，默认5次。
    human_description:
      en_US: "Number of retries for network requests. Range: 1-10. Default: 5."
      zh_Hans: "网络请求重试次数。范围：1-10。默认：5。"
    label:
      en_US: Retries
      zh_Hans: 重试次数
    min: 1
    max: 10
  - name: timeout
    type: number
    required: false
    form: llm
    default: 240
    description: 子进程超时时间
    llm_description: 子进程执行超时时间（秒），范围5-3600，默认240秒。
    human_description:
      en_US: "Subprocess execution timeout in seconds. Range: 5-3600. Default: 240."
      zh_Hans: "子进程执行超时时间（秒）。范围：5-3600。默认：240。"
    label:
      en_US: Subprocess Timeout
      zh_Hans: 子进程超时时间
    min: 5
    max: 3600
extra:
  python:
    source: tools/get_board_em.py

