identity:
  author: shaoxing-xie
  name: get_stock_balance_sheet
  label:
    zh_Hans: 获取个股财务报表-资产负债表
    en_US: Get Individual Stock Financial Statements - Balance Sheet
description:
  human:
    zh_Hans: 获取指定股票的资产负债表数据，包括资产、负债、所有者权益等完整的资产负债表信息，支持东方财富网、同花顺、新浪财经等多个数据源。
    en_US: Get balance sheet data for specified stocks, including assets, liabilities, owner's equity and other complete balance sheet information, supporting multiple data sources including East Money, Flush, and Sina Finance.
  llm: 获取指定股票的资产负债表数据，包括资产、负债、所有者权益等完整的资产负债表信息。包括：东方财富网-资产负债表(按报告期)（需要股票代码，返回指定股票所有报告期的资产负债表数据）、东方财富网-资产负债表(按年度)（需要股票代码，返回指定股票所有年度的资产负债表数据）、同花顺-资产负债表（需要股票代码和报告类型，返回指定股票指定报告类型的资产负债表所有历史数据）、新浪财经-财务报表-资产负债表（需要股票代码和报表类型，返回指定股票资产负债表的 all year history data）。根据不同接口提供相应参数。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: stock_balance_sheet_by_report_em
    description: 接口名称
    llm_description: 选择资产负债表数据接口。包括：东方财富网-资产负债表(按报告期)（需要股票代码，返回指定股票所有报告期的资产负债表数据）、东方财富网-资产负债表(按年度)（需要股票代码，返回指定股票所有年度的资产负债表数据）、同花顺-资产负债表（需要股票代码和报告类型，返回指定股票指定报告类型的资产负债表所有历史数据）、新浪财经-财务报表-资产负债表（需要股票代码和报表类型，返回指定股票资产负债表的所有年份历史数据）。根据不同接口提供相应参数。
    human_description:
      en_US: "Select balance sheet data interface. Options: East Money Balance Sheet (by Report Period/Year), Flush Balance Sheet, Sina Finance Balance Sheet."
      zh_Hans: "选择资产负债表数据接口。选项包括：东方财富网-资产负债表(按报告期/年度)、同花顺-资产负债表、新浪财经-财务报表-资产负债表。"
    label:
      en_US: Interface
      zh_Hans: 接口名称
    options:
      - label:
          en_US: East Money - Balance Sheet (by Report Period) - Specified Stock
          zh_Hans: 东方财富网-资产负债表(按报告期)-指定股票
        value: stock_balance_sheet_by_report_em
      - label:
          en_US: East Money - Balance Sheet (by Year) - Specified Stock
          zh_Hans: 东方财富网-资产负债表(按年度)-指定股票
        value: stock_balance_sheet_by_yearly_em
      - label:
          en_US: Flush - Balance Sheet - Specified Stock, Report Type
          zh_Hans: 同花顺-资产负债表-指定股票、报告类型
        value: stock_financial_debt_ths
      - label:
          en_US: Sina Finance - Financial Report - Three Major Statements - Specified Stock, Report Type
          zh_Hans: 新浪财经-财务报表-三大报表-指定股票、报表类型
        value: stock_financial_report_sina
  - name: stock_code
    type: string
    required: true
    form: llm
    default: "000001"
    description: 股票代码
    llm_description: 股票代码，支持A股格式，如600519（沪市）、000001（深市）、430xxx（北交所）等。
    human_description:
      en_US: "Stock code. Supports A-share formats, e.g., 600519 (Shanghai), 000001 (Shenzhen), 430xxx (Beijing Stock Exchange), etc."
      zh_Hans: "股票代码。支持A股格式，如600519（沪市）、000001（深市）、430xxx（北交所）等。"
    label:
      en_US: Stock Code
      zh_Hans: 股票代码
  - name: report_type
    type: select
    required: false
    form: llm
    default: 按年度
    description: 报告类型
    llm_description: 报告类型参数，用于同花顺资产负债表接口。选项：按年度（返回年度数据）、按报告期（返回报告期数据）、按单季度（返回季度数据）。
    human_description:
      en_US: "Report type. Required for Flush balance sheet interface. Options: By Year (按年度), By Report Period (按报告期), By Single Quarter (按单季度)."
      zh_Hans: "报告类型。用于同花顺资产负债表接口。选项：按年度、按报告期、按单季度。"
    label:
      en_US: Report Type
      zh_Hans: 报告类型
    options:
      - label:
          en_US: By Year
          zh_Hans: 按年度
        value: 按年度
      - label:
          en_US: By Report Period
          zh_Hans: 按报告期
        value: 按报告期
      - label:
          en_US: By Single Quarter
          zh_Hans: 按单季度
        value: 按单季度
  - name: report_type_sina
    type: select
    required: false
    form: llm
    default: 资产负债表
    description: 新浪报表类型
    llm_description: 新浪财经报表类型参数，用于新浪财经财务报表接口。选项：资产负债表、利润表、现金流量表。注意：此工具用于获取资产负债表数据，但新浪财经财务报表接口支持三种报表类型。
    human_description:
      en_US: "Sina Finance report type. Required for Sina Finance financial report interface. Options: Balance Sheet, Income Statement, Cash Flow Statement."
      zh_Hans: "新浪财经报表类型。用于新浪财经财务报表接口。选项：资产负债表、利润表、现金流量表。"
    label:
      en_US: Sina Report Type
      zh_Hans: 新浪报表类型
    options:
      - label:
          en_US: Balance Sheet
          zh_Hans: 资产负债表
        value: 资产负债表
      - label:
          en_US: Income Statement
          zh_Hans: 利润表
        value: 利润表
      - label:
          en_US: Cash Flow Statement
          zh_Hans: 现金流量表
        value: 现金流量表
  - name: retries
    type: number
    required: false
    form: llm
    default: 5
    description: 重试次数
    llm_description: 网络请求重试次数，范围1-10，默认5次。
    human_description:
      en_US: "Number of retries for network requests. Range: 1-10. Default: 5."
      zh_Hans: "网络请求重试次数。范围：1-10。默认：5。"
    label:
      en_US: Retries
      zh_Hans: 重试次数
    min: 1
    max: 10
  - name: timeout
    type: number
    required: false
    form: llm
    default: 600
    description: 子进程超时时间
    llm_description: 子进程执行超时时间（秒），范围5-3600，默认600秒（10分钟）。财务报表数据量可能较大，建议设置较长的超时时间。
    human_description:
      en_US: "Subprocess execution timeout in seconds. Range: 5-3600. Default: 600 (10 minutes). Financial statement data may be large, suggest longer timeout."
      zh_Hans: "子进程执行超时时间（秒）。范围：5-3600。默认：600（10分钟）。财务报表数据量可能较大，建议设置较长的超时时间。"
    label:
      en_US: Subprocess Timeout
      zh_Hans: 子进程超时时间
    min: 5
    max: 3600
extra:
  python:
    source: tools/get_stock_balance_sheet.py

