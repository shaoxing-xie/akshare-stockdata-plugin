identity:
  author: shaoxing-xie
  name: get_index_trend_momentum_minute
  label:
    zh_Hans: 获取指数趋势动量震荡指标(分钟)
    en_US: Get Index Trend Momentum Oscillator (Minute)
description:
  human:
    zh_Hans: 获取指数趋势动量震荡指标(分钟)。基于分钟级历史行情数据自动计算多种技术分析指标，包括移动平均线（MA5/MA10/MA20/MA30/MA60）、RSI相对强弱指标（RSI6/RSI12/RSI24）、MACD指标、KDJ随机指标、布林带指标、成交量均线（VMA5/VMA10/VMA20）等。支持1分钟、5分钟、15分钟、30分钟、60分钟周期，适用于指数日内走势分析、分时图技术分析和盘中交易决策。可帮助投资者捕捉指数的短期价格波动、识别日内买卖时机和监控盘中资金流向。
    en_US: Get index trend momentum oscillator (minute). Automatically calculates multiple technical analysis indicators based on minute-level historical quotes data, including moving averages (MA5/MA10/MA20/MA30/MA60), RSI relative strength indicators (RSI6/RSI12/RSI24), MACD indicators, KDJ stochastic indicators, Bollinger Bands, and volume moving averages (VMA5/VMA10/VMA20). Supports 1-minute, 5-minute, 15-minute, 30-minute, and 60-minute periods. Suitable for index intraday trend analysis, minute-chart technical analysis, and intraday trading decisions. Helps investors capture short-term price fluctuations of indices, identify intraday trading opportunities, and monitor intraday fund flows.
  llm: 获取指数趋势动量震荡指标(分钟)。基于分钟级历史行情数据计算技术指标，包括移动平均线（MA5、MA10、MA20、MA30、MA60）、RSI相对强弱指标（RSI6、RSI12、RSI24）、MACD指标、KDJ随机指标、布林带指标、成交量均线（VMA5、VMA10、VMA20）等。需要提供指数代码（纯数字格式，如000001、399006等）、分钟周期（1、5、15、30、60分钟）、开始日期时间和结束日期时间（格式：YYYY-MM-DD HH:MM:SS）。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: index_trend_momentum_oscillator_minute
    description: 接口名称
    llm_description: 选择指数趋势动量震荡指标(分钟)接口
    human_description:
      en_US: "Select the index trend momentum oscillator (minute) interface."
      zh_Hans: "选择指数趋势动量震荡指标(分钟)接口。"
