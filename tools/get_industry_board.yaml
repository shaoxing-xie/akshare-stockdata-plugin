identity:
  author: shaoxing-xie
  name: get_industry_board
  label:
    zh_Hans: 获取A股市场行业板块数据
    en_US: Get A-share Market Industry Board Data
description:
  human:
    zh_Hans: 获取A股市场行业板块数据。包括同花顺和东方财富的行业板块一览表、行业指数、板块列表、实时行情、成份股、历史行情和分时数据等。帮助了解行业板块的行情走势、成份股信息和资金流向。适用于行业板块分析、行业研究和投资决策。
    en_US: Get A-share market industry board data. Includes Flush and East Money industry board summaries, industry indices, board lists, real-time quotes, constituent stocks, historical quotes, and minute data. Helps understand industry board quote trends, constituent stock information, and fund flows. Suitable for industry board analysis, industry research, and investment decisions.
  llm: 获取A股市场行业板块数据。包括：同花顺-同花顺行业一览表（无需参数，返回当前时刻同花顺行业一览表）、同花顺-行业板块-指数日频率数据-指定行业板块、日期范围（需要行业名称和日期范围，格式YYYYMMDD，返回指定行业板块的日频指数数据）、东方财富-行业板块（无需参数，返回所有行业板块的实时行情数据）、东方财富-行业板块-实时行情-指定行业名称（需要行业名称，返回指定行业板块的实时行情）、东方财富-行业板块-板块成份-指定行业名称或板块代码（需要行业名称或板块代码，返回指定行业板块的成份股数据）、东方财富-行业板块-历史行情数据-指定行业名称、周期、日期范围和复权方式（需要行业名称、周期、日期范围和复权方式，返回指定行业板块的历史行情数据）、东方财富-行业板块-分时历史行情数据-指定行业名称和分时周期（需要行业名称和分时周期，返回指定行业板块的分时数据）。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: stock_board_industry_summary_ths
    description: 接口名称
    llm_description: 选择行业板块数据接口。包括：同花顺-同花顺行业一览表（无需参数）、同花顺-行业板块-指数日频率数据-指定行业板块、日期范围（需要行业名称和日期范围）、东方财富-行业板块（无需参数）、东方财富-行业板块-实时行情-指定行业名称（需要行业名称）、东方财富-行业板块-板块成份-指定行业名称或板块代码（需要行业名称或板块代码）、东方财富-行业板块-历史行情数据-指定行业名称、周期、日期范围和复权方式（需要行业名称、周期、日期范围和复权方式）、东方财富-行业板块-分时历史行情数据-指定行业名称和分时周期（需要行业名称和分时周期）。
    human_description:
      en_US: "Select industry board data interface. Options: Flush - Industry Board Summary (no parameters required), Flush - Industry Index (requires industry name and date range), East Money - Industry Board List (no parameters required), East Money - Industry Board Real-time Quotes (requires industry name), East Money - Constituent Stocks (requires industry name or board code), East Money - Index Daily Data (requires industry name, period, date range, and adjustment method), East Money - Index Minute Data (requires industry name and minute period)."
      zh_Hans: "选择行业板块数据接口。选项包括：同花顺-同花顺行业一览表（无需参数）、同花顺-行业板块-指数日频率数据-指定行业板块、日期范围（需要行业名称和日期范围）、东方财富-行业板块（无需参数）、东方财富-行业板块-实时行情-指定行业名称（需要行业名称）、东方财富-行业板块-板块成份-指定行业名称或板块代码（需要行业名称或板块代码）、东方财富-行业板块-历史行情数据-指定行业名称、周期、日期范围和复权方式（需要行业名称、周期、日期范围和复权方式）、东方财富-行业板块-分时历史行情数据-指定行业名称和分时周期（需要行业名称和分时周期）。"
    label:
      en_US: Interface
      zh_Hans: 接口名称
    options:
      - label:
          en_US: Flush - Industry Board Summary - All
          zh_Hans: 同花顺-同花顺行业一览表
        value: stock_board_industry_summary_ths
      - label:
          en_US: Flush - Industry Index - Industry Name and Date Range
          zh_Hans: 同花顺-行业板块-指数日频率数据-指定行业板块、日期范围
        value: stock_board_industry_index_ths
      - label:
          en_US: East Money - Industry Board List - All
          zh_Hans: 东方财富-行业板块
        value: stock_board_industry_name_em
      - label:
          en_US: East Money - Industry Board Real-time Quotes - Industry Name
          zh_Hans: 东方财富-行业板块-实时行情-指定行业名称
        value: stock_board_industry_spot_em
      - label:
          en_US: East Money - Constituent Stocks - Industry Name or Board Code
          zh_Hans: 东方财富-行业板块-板块成份-指定行业名称或板块代码
        value: stock_board_industry_cons_em
      - label:
          en_US: East Money - Index Daily Data - Industry Name, Period, Date Range, Adjustment
          zh_Hans: 东方财富-行业板块-历史行情数据-指定行业名称、周期、日期范围和复权方式
        value: stock_board_industry_hist_em
      - label:
          en_US: East Money - Index Minute Data - Industry Name and Minute Period
          zh_Hans: 东方财富-行业板块-分时历史行情数据-指定行业名称和分时周期
        value: stock_board_industry_hist_min_em
  - name: symbol
    type: string
    required: false
    form: llm
    default: "小金属"
    description: 行业名称
    llm_description: 行业名称，指定要查询的行业板块名称。同花顺接口需要同花顺行业名称（如"元件"），东方财富接口需要东方财富行业名称（如"小金属"、"煤炭行业"）或板块代码（如"BK1027"）。"同花顺-指数"、"东方财富-行业板块-实时行情"、"东方财富-成份股"、"东方财富-指数-日频"、"东方财富-指数-分时"接口需要此参数。
    human_description:
      en_US: "Industry name. Required for most interfaces. For Flush interfaces, use Flush industry names (e.g., '元件'). For East Money interfaces, use East Money industry names (e.g., '小金属', '煤炭行业') or board codes (e.g., 'BK1027'). Required for: Flush - Industry Index, East Money - Industry Board Real-time Quotes, East Money - Constituent Stocks, East Money - Index Daily Data, East Money - Index Minute Data."
      zh_Hans: "行业名称。大部分接口需要此参数。同花顺接口使用同花顺行业名称（如'元件'），东方财富接口使用东方财富行业名称（如'小金属'、'煤炭行业'）或板块代码（如'BK1027'）。同花顺-指数、东方财富-行业板块-实时行情、东方财富-成份股、东方财富-指数-日频、东方财富-指数-分时接口需要此参数。"
    label:
      en_US: Industry Name
      zh_Hans: 行业名称
  - name: start_date
    type: string
    required: false
    form: llm
    default: "20250101"
    description: 开始日期
    llm_description: 开始日期，格式为YYYYMMDD（如20240101）。"同花顺-指数"和"东方财富-指数-日频"接口需要此参数。
    human_description:
      en_US: "Start date in YYYYMMDD format (e.g., 20240101). Required for 'Flush - Industry Index' and 'East Money - Index Daily Data' interfaces."
      zh_Hans: "开始日期，格式为YYYYMMDD（如20240101）。同花顺-指数和东方财富-指数-日频接口需要此参数。"
    label:
      en_US: Start Date
      zh_Hans: 开始日期
  - name: end_date
    type: string
    required: false
    form: llm
    default: "20251118"
    description: 结束日期
    llm_description: 结束日期，格式为YYYYMMDD（如20240718）。"同花顺-指数"和"东方财富-指数-日频"接口需要此参数。
    human_description:
      en_US: "End date in YYYYMMDD format (e.g., 20240718). Required for 'Flush - Industry Index' and 'East Money - Index Daily Data' interfaces."
      zh_Hans: "结束日期，格式为YYYYMMDD（如20240718）。同花顺-指数和东方财富-指数-日频接口需要此参数。"
    label:
      en_US: End Date
      zh_Hans: 结束日期
  - name: period
    type: select
    required: false
    form: llm
    default: "日k"
    description: 周期
    llm_description: 周期，选择数据周期。仅"东方财富-指数-日频"接口需要此参数。选项包括：日k（日线）、周k（周线）、月k（月线）。
    human_description:
      en_US: "Period. Required only for 'East Money - Index Daily Data' interface. Options: 日k (Daily), 周k (Weekly), 月k (Monthly)."
      zh_Hans: "周期。仅东方财富-指数-日频接口需要此参数。选项包括：日k（日线）、周k（周线）、月k（月线）。"
    label:
      en_US: Period
      zh_Hans: 周期
    options:
      - label:
          en_US: Daily
          zh_Hans: 日k
        value: "日k"
      - label:
          en_US: Weekly
          zh_Hans: 周k
        value: "周k"
      - label:
          en_US: Monthly
          zh_Hans: 月k
        value: "月k"
  - name: adjust
    type: select
    required: false
    form: llm
    default: "none"
    description: 复权方式
    llm_description: 复权方式，选择复权类型。仅"东方财富-指数-日频"接口需要此参数。选项包括：空字符串（不复权）、qfq（前复权）、hfq（后复权）。
    human_description:
      en_US: "Adjustment method. Required only for 'East Money - Index Daily Data' interface. Options: Empty string (No Adjustment), qfq (Forward Adjustment), hfq (Backward Adjustment)."
      zh_Hans: "复权方式。仅东方财富-指数-日频接口需要此参数。选项包括：空字符串（不复权）、qfq（前复权）、hfq（后复权）。"
    label:
      en_US: Adjustment Method
      zh_Hans: 复权方式
    options:
      - label:
          en_US: No Adjustment
          zh_Hans: 不复权
        value: "none"
      - label:
          en_US: Forward Adjustment
          zh_Hans: 前复权
        value: "qfq"
      - label:
          en_US: Backward Adjustment
          zh_Hans: 后复权
        value: "hfq"
  - name: minute_period
    type: select
    required: false
    form: llm
    default: "1"
    description: 分时周期
    llm_description: 分时周期，选择分时数据周期。仅"东方财富-指数-分时"接口需要此参数。选项包括：1（1分钟）、5（5分钟）、15（15分钟）、30（30分钟）、60（60分钟）。
    human_description:
      en_US: "Minute period. Required only for 'East Money - Index Minute Data' interface. Options: 1 (1 minute), 5 (5 minutes), 15 (15 minutes), 30 (30 minutes), 60 (60 minutes)."
      zh_Hans: "分时周期。仅东方财富-指数-分时接口需要此参数。选项包括：1（1分钟）、5（5分钟）、15（15分钟）、30（30分钟）、60（60分钟）。"
    label:
      en_US: Minute Period
      zh_Hans: 分时周期
    options:
      - label:
          en_US: 1 Minute
          zh_Hans: 1分钟
        value: "1"
      - label:
          en_US: 5 Minutes
          zh_Hans: 5分钟
        value: "5"
      - label:
          en_US: 15 Minutes
          zh_Hans: 15分钟
        value: "15"
      - label:
          en_US: 30 Minutes
          zh_Hans: 30分钟
        value: "30"
      - label:
          en_US: 60 Minutes
          zh_Hans: 60分钟
        value: "60"
  - name: retries
    type: number
    required: false
    form: llm
    default: 5
    description: 重试次数
    llm_description: 网络请求重试次数，范围1-10，默认5次。
    human_description:
      en_US: "Number of retries for network requests. Range: 1-10. Default: 5."
      zh_Hans: "网络请求重试次数。范围：1-10。默认：5。"
    label:
      en_US: Retries
      zh_Hans: 重试次数
    min: 1
    max: 10
  - name: timeout
    type: number
    required: false
    form: llm
    default: 240
    description: 子进程超时时间
    llm_description: 子进程执行超时时间（秒），范围5-3600，默认240秒。
    human_description:
      en_US: "Subprocess execution timeout in seconds. Range: 5-3600. Default: 240."
      zh_Hans: "子进程执行超时时间（秒）。范围：5-3600。默认：240。"
    label:
      en_US: Subprocess Timeout
      zh_Hans: 子进程超时时间
    min: 5
    max: 3600
extra:
  python:
    source: tools/get_industry_board.py

