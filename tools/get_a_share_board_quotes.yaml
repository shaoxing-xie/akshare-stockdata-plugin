identity:
  author: shaoxing-xie
  name: get_a_share_board_quotes
  label:
    zh_Hans: 获取A股板块实时行情
    en_US: Get A-Share Board Quotes
description:
  human:
    zh_Hans: 获取A股特殊板块的实时行情数据，包括创业板、科创板、新股板块、次新股、风险警示板等全量板块数据。数据量较大，返回板块内所有股票的实时价格、涨跌幅、成交量等信息。
    en_US: Get real-time quotes for A-share special boards, including Growth Enterprise Market, Science and Technology Innovation Board, new stock board, secondary new stocks, risk warning board. Large data volumes, returns real-time prices, changes, trading volumes for all stocks in the board.
  llm: 获取A股特殊板块的实时行情数据，包括创业板、科创板、新股板块、次新股、风险警示板等全量板块数据。包括：创业板实时行情、科创板实时行情、新股板块实时行情、次新股实时行情、风险警示板实时行情。所有接口无需参数，返回对应板块的所有股票的实时行情数据，包括股票代码、名称、最新价、涨跌幅、涨跌额、成交量、成交额、换手率等。注意：数据量较大，建议设置较长的超时时间。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: stock_cy_a_spot_em
    description: 接口名称
    llm_description: 选择A股板块实时行情接口。包括：创业板实时行情、科创板实时行情、新股板块实时行情、次新股实时行情、风险警示板实时行情。所有接口无需参数，返回对应板块的所有股票实时行情数据。
    human_description:
      en_US: "Select A-share board real-time quotes interface. Options: Growth Enterprise Market, Science and Technology Innovation Board, New Stock Board, Secondary New Stocks, Risk Warning Board. All interfaces require no parameters, return all stock real-time quotes for the corresponding board."
      zh_Hans: "选择A股板块实时行情接口。选项包括：创业板实时行情、科创板实时行情、新股板块实时行情、次新股实时行情、风险警示板实时行情。所有接口无需参数，返回对应板块的所有股票实时行情数据。"
    label:
      en_US: Interface
      zh_Hans: 接口名称
    options:
      - label:
          en_US: Eastmoney - Growth Enterprise Market - Real-time Quotes
          zh_Hans: 东方财富网-创业板-实时行情
        value: stock_cy_a_spot_em
      - label:
          en_US: Eastmoney - Science and Technology Innovation Board - Real-time Quotes
          zh_Hans: 东方财富网-科创板-实时行情
        value: stock_kc_a_spot_em
      - label:
          en_US: Eastmoney - Shanghai-Shenzhen Individual Stocks - New Stock Board
          zh_Hans: 东方财富网-沪深个股-新股板块实时行情
        value: stock_zh_a_new_em
      - label:
          en_US: Sina Finance - Shanghai-Shenzhen Stock Market - Secondary New Stocks
          zh_Hans: 新浪财经-沪深股市-次新股-实时行情
        value: stock_zh_a_new
      - label:
          en_US: Eastmoney - Shanghai-Shenzhen Individual Stocks - Risk Warning Board
          zh_Hans: 东方财富网-沪深个股-风险警示板实时行情
        value: stock_zh_a_st_em
  - name: retries
    type: number
    required: false
    form: llm
    default: 5
    description: 重试次数
    llm_description: 网络请求重试次数，范围1-10，默认5次。
    human_description:
      en_US: "Number of retries for network requests. Range: 1-10. Default: 5."
      zh_Hans: "网络请求重试次数。范围：1-10。默认：5。"
    label:
      en_US: Retries
      zh_Hans: 重试次数
    min: 1
    max: 10
  - name: timeout
    type: number
    required: false
    form: llm
    default: 900
    description: 子进程超时时间
    llm_description: 子进程执行超时时间（秒），范围5-3600，默认900秒（15分钟）。实时行情接口数据量大，建议设置较长的超时时间。
    human_description:
      en_US: "Subprocess execution timeout in seconds. Range: 5-3600. Default: 900 (15 minutes). Real-time market data interfaces have large data volumes, recommend setting longer timeout."
      zh_Hans: "子进程执行超时时间（秒）。范围：5-3600。默认：900（15分钟）。实时行情接口数据量大，建议设置较长的超时时间。"
    label:
      en_US: Subprocess Timeout
      zh_Hans: 子进程超时时间
    min: 5
    max: 3600
extra:
  python:
    source: tools/get_a_share_board_quotes.py

