identity:
  author: shaoxing-xie
  name: get_market_stock_fund_flow_rank
  label:
    zh_Hans: 获取当前市场资金流向个股排名
    en_US: Get Current Market Stock Fund Flow Rankings
description:
  human:
    zh_Hans: 获取当前市场中的资金流向个股排名数据，包括整体市场和指定行业内的个股排名，帮助了解哪些个股资金流入流出最多。
    en_US: Get current market stock fund flow ranking data, including overall market and industry-specific stock rankings, helping to understand which stocks have the most fund inflows and outflows.
  llm: 获取当前市场中的资金流向个股排名数据，包括整体市场和指定行业内的个股排名。包括：东方财富网-资金流向-排名（需要统计周期，返回整体市场个股资金流排名）、东方财富网-主力净流入排名（需要市场选择，返回指定市场的主力净流入排名）、同花顺-个股资金流（需要排行类别，返回整体市场个股资金流排行）、东方财富网-行业资金流-xx行业个股资金流（需要行业名称和统计周期，返回指定行业内个股资金流排名）。根据不同接口提供相应参数。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: stock_fund_flow_individual
    description: 接口名称
    llm_description: 选择资金流向个股排名数据接口。包括：东方财富网-资金流向-排名（需要统计周期，返回整体市场个股资金流排名）、东方财富网-主力净流入排名（需要市场选择，返回指定市场的主力净流入排名）、同花顺-个股资金流（需要排行类别，返回整体市场个股资金流排行）、东方财富网-行业资金流-xx行业个股资金流（需要行业名称和统计周期，返回指定行业内个股资金流排名）。根据不同接口提供相应参数。
    human_description:
      en_US: "Select stock fund flow ranking data interface. Options: East Money - Fund Flow Rankings (requires statistical period, returns overall market stock fund flow rankings), East Money - Main Force Net Inflow Rankings (requires market choice, returns main force net inflow rankings for specified market), Flush - Individual Stock Fund Flow (requires ranking category, returns overall market stock fund flow rankings), East Money - Industry Fund Flow - XX Industry Individual Stock Fund Flow (requires industry name and statistical period, returns stock fund flow rankings within specified industry). Provide corresponding parameters according to different interfaces."
      zh_Hans: "选择资金流向个股排名数据接口。选项包括：东方财富网-资金流向-排名（需要统计周期，返回整体市场个股资金流排名）、东方财富网-主力净流入排名（需要市场选择，返回指定市场的主力净流入排名）、同花顺-个股资金流（需要排行类别，返回整体市场个股资金流排行）、东方财富网-行业资金流-xx行业个股资金流（需要行业名称和统计周期，返回指定行业内个股资金流排名）。根据不同接口提供相应参数。"
    label:
      en_US: Interface
      zh_Hans: 接口名称
    options:
      - label:
          en_US: Flush - Individual Stock Fund Flow - Specified Ranking Category
          zh_Hans: 同花顺-个股资金流-指定排行类别
        value: stock_fund_flow_individual
      - label:
          en_US: East Money - Industry Fund Flow - XX Industry Individual Stock Fund Flow - Specified Industry Name, Statistical Period
          zh_Hans: 东方财富网-行业资金流-xx行业个股资金流-指定行业名称、统计周期
        value: stock_sector_fund_flow_summary
      - label:
          en_US: East Money - Fund Flow Rankings - Specified Statistical Period
          zh_Hans: 东方财富网-资金流向-排名-指定统计周期
        value: stock_individual_fund_flow_rank
      - label:
          en_US: East Money - Main Force Net Inflow Rankings - Specified Market Choice
          zh_Hans: 东方财富网-主力净流入排名-指定市场选择
        value: stock_main_fund_flow
  - name: indicator
    type: select
    required: false
    form: llm
    default: 今日
    description: 统计周期
    llm_description: 统计周期参数，用于资金流向排名和行业个股资金流接口。选项：今日、3日、5日、10日。注意：行业个股资金流接口不支持"3日"选项。
    human_description:
      en_US: "Statistical period. Required for fund flow rankings and industry individual stock fund flow interfaces. Options: Today, 3 Days, 5 Days, 10 Days. Note: Industry individual stock fund flow interface does not support '3 Days' option."
      zh_Hans: "统计周期。用于资金流向排名和行业个股资金流接口。选项：今日、3日、5日、10日。注意：行业个股资金流接口不支持'3日'选项。"
    label:
      en_US: Statistical Period
      zh_Hans: 统计周期
    options:
      - label:
          en_US: Today
          zh_Hans: 今日
        value: 今日
      - label:
          en_US: 3 Days
          zh_Hans: 3日
        value: 3日
      - label:
          en_US: 5 Days
          zh_Hans: 5日
        value: 5日
      - label:
          en_US: 10 Days
          zh_Hans: 10日
        value: 10日
  - name: market_choice
    type: select
    required: false
    form: llm
    default: 全部股票
    description: 市场选择
    llm_description: 市场选择参数，用于主力净流入排名接口。选项：全部股票、沪深A股、沪市A股、科创板、深市A股、创业板、沪市B股、深市B股。
    human_description:
      en_US: "Market choice. Required for main force net inflow rankings interface. Options: All Stocks, Shanghai-Shenzhen A Shares, Shanghai A-shares, STAR Market, Shenzhen A-shares, ChiNext, Shanghai B-shares, Shenzhen B-shares."
      zh_Hans: "市场选择。用于主力净流入排名接口。选项：全部股票、沪深A股、沪市A股、科创板、深市A股、创业板、沪市B股、深市B股。"
    label:
      en_US: Market Choice
      zh_Hans: 市场选择
    options:
      - label:
          en_US: All Stocks
          zh_Hans: 全部股票
        value: 全部股票
      - label:
          en_US: Shanghai-Shenzhen A Shares
          zh_Hans: 沪深A股
        value: 沪深A股
      - label:
          en_US: Shanghai A-shares
          zh_Hans: 沪市A股
        value: 沪市A股
      - label:
          en_US: STAR Market
          zh_Hans: 科创板
        value: 科创板
      - label:
          en_US: Shenzhen A-shares
          zh_Hans: 深市A股
        value: 深市A股
      - label:
          en_US: ChiNext
          zh_Hans: 创业板
        value: 创业板
      - label:
          en_US: Shanghai B-shares
          zh_Hans: 沪市B股
        value: 沪市B股
      - label:
          en_US: Shenzhen B-shares
          zh_Hans: 深市B股
        value: 深市B股
  - name: symbol
    type: select
    required: false
    form: llm
    default: 即时
    description: 排行类别
    llm_description: 排行类别参数，用于同花顺个股资金流接口。选项：即时、3日排行、5日排行、10日排行、20日排行。
    human_description:
      en_US: "Ranking category. Required for Flush individual stock fund flow interface. Options: Real-time, 3-day ranking, 5-day ranking, 10-day ranking, 20-day ranking."
      zh_Hans: "排行类别。用于同花顺个股资金流接口。选项：即时、3日排行、5日排行、10日排行、20日排行。"
    label:
      en_US: Ranking Category
      zh_Hans: 排行类别
    options:
      - label:
          en_US: Real-time
          zh_Hans: 即时
        value: 即时
      - label:
          en_US: 3-day Ranking
          zh_Hans: 3日排行
        value: 3日排行
      - label:
          en_US: 5-day Ranking
          zh_Hans: 5日排行
        value: 5日排行
      - label:
          en_US: 10-day Ranking
          zh_Hans: 10日排行
        value: 10日排行
      - label:
          en_US: 20-day Ranking
          zh_Hans: 20日排行
        value: 20日排行
  - name: industry_name
    type: string
    required: false
    form: llm
    default: 汽车服务
    description: 行业名称
    llm_description: 行业名称参数，用于行业个股资金流接口。示例：汽车服务、电源设备、软件开发等。参照东方财富网行业分类。
    human_description:
      en_US: "Industry name. Required for industry individual stock fund flow interface. Examples: Automobile Services, Power Equipment, Software Development, etc. Reference: East Money industry classification."
      zh_Hans: "行业名称。用于行业个股资金流接口。示例：汽车服务、电源设备、软件开发等。参照东方财富网行业分类。"
    label:
      en_US: Industry Name
      zh_Hans: 行业名称
  - name: retries
    type: number
    required: false
    form: llm
    default: 5
    description: 重试次数
    llm_description: 网络请求重试次数，范围1-10，默认5次。
    human_description:
      en_US: "Number of retries for network requests. Range: 1-10. Default: 5."
      zh_Hans: "网络请求重试次数。范围：1-10。默认：5。"
    label:
      en_US: Retries
      zh_Hans: 重试次数
    min: 1
    max: 10
  - name: timeout
    type: number
    required: false
    form: llm
    default: 600
    description: 子进程超时时间
    llm_description: 子进程执行超时时间（秒），范围5-3600，默认600秒（10分钟）。排名接口数据量可能较大，建议设置较长的超时时间。
    human_description:
      en_US: "Subprocess execution timeout in seconds. Range: 5-3600. Default: 600 (10 minutes). Ranking interfaces may have large data volumes, suggest longer timeout."
      zh_Hans: "子进程执行超时时间（秒）。范围：5-3600。默认：600（10分钟）。排名接口数据量可能较大，建议设置较长的超时时间。"
    label:
      en_US: Subprocess Timeout
      zh_Hans: 子进程超时时间
    min: 5
    max: 3600
extra:
  python:
    source: tools/get_market_stock_fund_flow_rank.py

