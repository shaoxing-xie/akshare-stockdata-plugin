identity:
  author: shaoxing-xie
  name: get_hk_spot_quotes
  label:
    zh_Hans: 获取港股实时行情
    en_US: Get Hong Kong Stock Real-time Quotes
description:
  human:
    zh_Hans: 获取港股实时行情数据，包括东方财富网和新浪的港股实时行情接口，提供港股主板和知名港股实时行情数据。
    en_US: Get Hong Kong stock real-time quotes data, including East Money and Sina Hong Kong stock real-time quotes interfaces, providing Hong Kong Main Board and famous Hong Kong stocks real-time quotes data.
  llm: 获取港股实时行情数据。包括：东方财富网-港股-实时行情(延15分钟)、新浪-港股-实时行情(延15分钟)、东方财富网-港股主板-实时行情(延15分钟)、东方财富网-港股市场-知名港股实时行情数据。所有接口不需要额外参数。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: stock_hk_spot
    description: 接口名称
    llm_description: 选择港股实时行情接口
    human_description:
      en_US: "Select the Hong Kong stock real-time quotes interface."
      zh_Hans: "选择港股实时行情接口。"
    label:
      en_US: Interface
      zh_Hans: 接口名称
    options:
      - label:
          en_US: Sina - HK Stock - Real-time Quotes (15min delay)
          zh_Hans: 新浪-港股-实时行情(延15分钟)
        value: stock_hk_spot
  - name: retries
    type: number
    required: false
    form: llm
    default: 5
    description: 重试次数
    llm_description: 网络请求重试次数，默认5次
    human_description:
      en_US: "Number of retries for network requests. Range: 1-10. Default: 5."
      zh_Hans: "网络请求重试次数。范围：1-10。默认：5。"
    label:
      en_US: Retries
      zh_Hans: 重试次数
    min: 1
    max: 10
  - name: timeout
    type: number
    required: false
    form: llm
    default: 600
    description: 子进程超时时间
    llm_description: 子进程执行超时时间（秒），默认600秒
    human_description:
      en_US: "Subprocess execution timeout in seconds. Range: 5-3600. Default: 600."
      zh_Hans: "子进程执行超时时间（秒）。范围：5-3600。默认：600。"
    label:
      en_US: Subprocess Timeout
      zh_Hans: 子进程超时时间
    min: 5
    max: 3600
extra:
  python:
    source: tools/get_hk_spot_quotes.py

