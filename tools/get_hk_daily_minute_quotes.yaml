identity:
  author: shaoxing-xie
  name: get_hk_daily_minute_quotes
  label:
    zh_Hans: 获取港股个股每日分时行情
    en_US: Get Hong Kong Stock Individual Daily Minute Quotes
description:
  human:
    zh_Hans: 获取港股个股每日分时行情数据，支持指定股票代码、周期、日期范围和复权方式。帮助了解港股个股的分时交易情况。
    en_US: Get Hong Kong stock individual daily minute quotes data, supporting specifying stock code, period, date range and adjustment method. Helps understand intraday trading situations of Hong Kong stocks.
  llm: 获取港股个股每日分时行情数据。包括：东方财富网-港股-每日分时行情-指定股票代码、周期、日期范围、复权方式。需要提供港股代码、周期、日期范围和复权方式。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: stock_hk_hist_min_em
    description: 接口名称
    llm_description: 选择港股每日分时行情接口。包括：东方财富网-港股-每日分时行情-指定股票代码、周期、日期范围、复权方式。需要提供港股代码、周期、日期范围和复权方式。
    human_description:
      en_US: "Select Hong Kong stock daily minute quotes interface. Options: Eastmoney - HK Stock - Daily Minute Data - Specify Stock Code, Period, Date Range, Adjustment Method. Requires Hong Kong stock code, period, date range and adjustment method."
      zh_Hans: "选择港股每日分时行情接口。选项包括：东方财富网-港股-每日分时行情-指定股票代码、周期、日期范围、复权方式。需要提供港股代码、周期、日期范围和复权方式。"
    label:
      en_US: Interface
      zh_Hans: 接口名称
    options:
      - label:
          en_US: East Money - HK Stock - Daily Minute Data - Specify Stock Code, Period, Date Range, Adjustment Method
          zh_Hans: 东方财富网-港股-每日分时行情-指定股票代码、周期、日期范围、复权方式
        value: stock_hk_hist_min_em
  - name: stock_code
    type: string
    required: false
    form: llm
    default: "00700"
    description: 港股代码
    llm_description: 港股代码，格式：00700、03900、HK00700；港股：5位数字代码(00700)或市场前缀(HK00700)
    human_description:
      en_US: "Hong Kong stock code. Format: 00700, 03900, HK00700."
      zh_Hans: "港股代码。格式：00700、03900、HK00700；港股：5位数字代码(00700)或市场前缀(HK00700)。"
    label:
      en_US: HK Stock Code
      zh_Hans: 港股代码
  - name: period
    type: select
    required: false
    form: llm
    default: 5
    description: 周期（分时行情类）
    llm_description: 分时行情接口的周期参数，用于港股分时数据接口。选项：1(1分钟)、5(5分钟)、15(15分钟)、30(30分钟)、60(60分钟)。
    human_description:
      en_US: "Period. Required for: HK Stock - Daily Minute Data. Options: 1 (1 minute), 5 (5 minutes), 15 (15 minutes), 30 (30 minutes), 60 (60 minutes)."
      zh_Hans: "周期（分时行情类）。需要此参数的接口：港股-每日分时行情。选项：1(1分钟)、5(5分钟)、15(15分钟)、30(30分钟)、60(60分钟)。"
    label:
      en_US: Period (Minute Data)
      zh_Hans: 周期（分时行情类）
    options:
      - label:
          en_US: 1 Minute
          zh_Hans: 1分钟
        value: "1"
      - label:
          en_US: 5 Minutes
          zh_Hans: 5分钟
        value: "5"
      - label:
          en_US: 15 Minutes
          zh_Hans: 15分钟
        value: "15"
      - label:
          en_US: 30 Minutes
          zh_Hans: 30分钟
        value: "30"
      - label:
          en_US: 60 Minutes
          zh_Hans: 60分钟
        value: "60"
  - name: start_date
    type: string
    required: false
    form: llm
    default: "20250801"
    description: 开始日期
    llm_description: 历史数据的开始日期，格式为YYYYMMDD
    human_description:
      en_US: "Start date. Required for: HK Stock - Daily Minute Data. Format: YYYYMMDD (20240101)."
      zh_Hans: "开始日期。需要此参数的接口：港股-每日分时行情。格式：YYYYMMDD(20240101)。"
    label:
      en_US: Start Date
      zh_Hans: 开始日期
  - name: end_date
    type: string
    required: false
    form: llm
    default: "20251231"
    description: 结束日期
    llm_description: 历史数据的结束日期，格式为YYYYMMDD
    human_description:
      en_US: "End date. Required for: HK Stock - Daily Minute Data. Format: YYYYMMDD (20240101)."
      zh_Hans: "结束日期。需要此参数的接口：港股-每日分时行情。格式：YYYYMMDD(20240101)。"
    label:
      en_US: End Date
      zh_Hans: 结束日期
  - name: adjust
    type: select
    required: false
    form: llm
    default: "none"
    description: 复权方式
    llm_description: 价格复权方式，支持前复权、后复权、不复权。港股每日分时行情接口支持qfq(前复权)、hfq(后复权)、空字符串(不复权)
    human_description:
      en_US: "Adjustment method. Required for: HK Stock - Daily Minute Data. Options: qfq (前复权), hfq (后复权), none (不复权)."
      zh_Hans: "复权方式。需要此参数的接口：港股-每日分时行情。选项：qfq(前复权)、hfq(后复权)、none(不复权)。"
    label:
      en_US: Adjustment
      zh_Hans: 复权方式
    options:
      - label:
          en_US: No Adjustment
          zh_Hans: 不复权
        value: "none"
      - label:
          en_US: Forward Adjustment
          zh_Hans: 前复权
        value: "qfq"
      - label:
          en_US: Backward Adjustment
          zh_Hans: 后复权
        value: "hfq"
  - name: retries
    type: number
    required: false
    form: llm
    default: 5
    description: 重试次数
    llm_description: 网络请求重试次数，默认5次
    human_description:
      en_US: "Number of retries for network requests. Range: 1-10. Default: 5."
      zh_Hans: "网络请求重试次数。范围：1-10。默认：5。"
    label:
      en_US: Retries
      zh_Hans: 重试次数
    min: 1
    max: 10
  - name: timeout
    type: number
    required: false
    form: llm
    default: 600
    description: 子进程超时时间
    llm_description: 子进程执行超时时间（秒），默认600秒
    human_description:
      en_US: "Subprocess execution timeout in seconds. Range: 5-3600. Default: 600."
      zh_Hans: "子进程执行超时时间（秒）。范围：5-3600。默认：600。"
    label:
      en_US: Subprocess Timeout
      zh_Hans: 子进程超时时间
    min: 5
    max: 3600
extra:
  python:
    source: tools/get_hk_daily_minute_quotes.py

