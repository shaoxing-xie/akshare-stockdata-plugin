identity:
  author: shaoxing-xie
  name: get_technical_volume_analysis
  label:
    zh_Hans: 获取技术选股-成交量分析数据
    en_US: Get Technical Stock Selection - Volume Analysis Data
description:
  human:
    zh_Hans: 获取股票持续放量/持续缩量的技术选股数据，包括放量天数、缩量天数、阶段涨跌幅等信息。
    en_US: Get technical stock selection data for continuously increasing/decreasing volume stocks, including volume increase days, volume decrease days, stage price change, etc.
  llm: 获取股票持续放量/持续缩量的技术选股数据。包括：同花顺-技术选股-持续放量（无需参数，返回所有持续放量的股票数据）、同花顺-技术选股-持续缩量（无需参数，返回所有持续缩量的股票数据）。
parameters:
  - name: interface
    type: select
    required: true
    form: llm
    default: stock_rank_cxfl_ths
    description: 接口名称
    llm_description: 选择成交量分析数据接口。包括：同花顺-技术选股-持续放量、同花顺-技术选股-持续缩量。这两个接口均无需参数。
    human_description:
      en_US: "Select volume analysis data interface. Options: Continuous Volume Increase, Continuous Volume Decrease. Both interfaces require no parameters."
      zh_Hans: "选择成交量分析数据接口。选项包括：同花顺-技术选股-持续放量、同花顺-技术选股-持续缩量。这两个接口均无需参数。"
    label:
      en_US: Interface
      zh_Hans: 接口名称
    options:
      - label:
          en_US: Continuous Volume Increase
          zh_Hans: 同花顺-技术选股-持续放量
        value: stock_rank_cxfl_ths
      - label:
          en_US: Continuous Volume Decrease
          zh_Hans: 同花顺-技术选股-持续缩量
        value: stock_rank_cxsl_ths
  - name: retries
    type: number
    required: false
    form: llm
    default: 5
    description: 重试次数
    llm_description: 接口调用失败时的重试次数，默认为5次
    human_description:
      en_US: "Number of retries when interface call fails, default is 5"
      zh_Hans: "接口调用失败时的重试次数，默认为5次"
    label:
      en_US: Retries
      zh_Hans: 重试次数
    min: 1
    max: 10
  - name: timeout
    type: number
    required: false
    form: llm
    default: 120
    description: 超时时间
    llm_description: 接口调用的超时时间（秒），默认为120秒
    human_description:
      en_US: "Timeout for interface calls in seconds, default is 120"
      zh_Hans: "接口调用的超时时间（秒），默认为120秒"
    label:
      en_US: Timeout
      zh_Hans: 超时时间
    min: 5
    max: 1800
extra:
  python:
    source: tools/get_technical_volume_analysis.py

